<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Ruta no encontrada · Sergio Toro</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0B0A">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0B0B0A;
      color: #F2EEE4;
      font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .box { max-width: 560px; text-align: center; }
    .mark {
      margin: 0 auto 26px;
      font-size: 3.2rem;
      font-weight: 300;
      letter-spacing: -.07em;
      line-height: 1;
    }
    .mark span { color: #FFA45C; }
    .code { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #FFA45C; }
    h1 { margin: 12px 0 14px; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 300; line-height: .95; letter-spacing: -.045em; }
    h1 em { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
    p { color: rgba(242,238,228,.62); font-size: .95rem; line-height: 1.6; max-width: 38ch; margin: 0 auto 28px; }
    a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 22px; border-radius: 999px;
      background: #FFA45C; color: #0B0B0A;
      font-size: .85rem; font-weight: 500; text-decoration: none;
    }
    a:hover { background: #F2EEE4; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">ST<span>.</span></div>
    <p class="code" id="code">Error 404 / Ruta no encontrada</p>
    <h1 id="title">Aquí no hay <em>nada.</em></h1>
    <p id="desc">La página que buscas no existe, se ha mudado o nunca estuvo aquí. Vuelve al portfolio y seguimos hablando.</p>
    <a id="back" href="./">Volver al inicio <span aria-hidden="true">→</span></a>
  </div>
  <script>
    (() => {
      const copy = {
        es: {
          title: '404 — Ruta no encontrada · Sergio Toro',
          code: 'Error 404 / Ruta no encontrada',
          h1: 'Aquí no hay <em>nada.</em>',
          p: 'La página que buscas no existe, se ha mudado o nunca estuvo aquí. Vuelve al portfolio y seguimos hablando.',
          back: 'Volver al inicio',
        },
        en: {
          title: '404 — Route not found · Sergio Toro',
          code: 'Error 404 / Route not found',
          h1: "There's <em>nothing</em> here.",
          p: "The page you're looking for doesn't exist, has moved, or was never here. Head back to the portfolio and let's keep talking.",
          back: 'Back to home',
        },
        zh: {
          title: '404 — 页面未找到 · Sergio Toro',
          code: '错误 404 / 页面未找到',
          h1: '这里什么也<em>没有。</em>',
          p: '你找的页面不存在、已经搬走，或者从来就不在这里。回作品集吧，我们继续聊。',
          back: '回到首页',
        },
      };
      const query = new URLSearchParams(location.search).get('lang');
      let lang = query;
      if (!['es', 'en', 'zh'].includes(lang)) {
        try { lang = localStorage.getItem('st-lang'); } catch { /* private mode */ }
      }
      if (!['es', 'en', 'zh'].includes(lang)) lang = 'es';
      const t = copy[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
      document.title = t.title;
      document.getElementById('code').textContent = t.code;
      document.getElementById('title').innerHTML = t.h1;
      document.getElementById('desc').textContent = t.p;
      document.getElementById('back').innerHTML = `${t.back} <span aria-hidden="true">→</span>`;
    })();
  </script>
</body>
</html>
